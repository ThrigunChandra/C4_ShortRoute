services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: thrig
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: onetwo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  postgres_data: